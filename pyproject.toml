[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "C901", "PLR0912", "PLR0915"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "integrations/hermes/tests"]
