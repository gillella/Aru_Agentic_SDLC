name: Aru governed pull request checks
description: >-
  Run the Factory's exact-head verification against the consumer checkout in the
  workspace. The caller owns the trust boundary, the checkout and the check name;
  everything judged here comes from this repository at the pinned tag.

inputs:
  runner-profile:
    description: The runner profile the calling workflow declares.
    required: true
  pr-number:
    description: The pull request being verified.
    required: true
  expected-head:
    description: The exact head SHA the caller checked out.
    required: true
  github-token:
    description: Token used only to read the pull request and its linked issues.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve the Factory checkout
      shell: bash
      env:
        ARU_RUNNER_PROFILE: ${{ inputs.runner-profile }}
      run: |
        set -euo pipefail
        root="$(cd "${GITHUB_ACTION_PATH}/../../.." && pwd)"
        [ -f "${root}/scripts/verify_consumer.sh" ] \
          || { echo "::error::the Factory checkout at ${root} has no scripts/verify_consumer.sh"; exit 1; }
        case "${ARU_RUNNER_PROFILE}" in
          self-hosted-mac|github-hosted) ;;
          *) echo "::error::unknown runner profile: ${ARU_RUNNER_PROFILE}"; exit 1 ;;
        esac
        command -v python3
        python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
        command -v gh
        echo "ARU_SDLC_HOME=${root}" >> "${GITHUB_ENV}"
        echo "aru: verifying with $(git -C "${root}" rev-parse --short HEAD 2>/dev/null || echo 'a packaged tag') of ${GITHUB_ACTION_REPOSITORY:-this repository}"

    - name: Run the Factory verifier against this head
      shell: bash
      env:
        ARU_RUNNER_PROFILE: ${{ inputs.runner-profile }}
        ARU_FACTORY_SLUG: ${{ github.action_repository }}
      run: bash "${ARU_SDLC_HOME}/scripts/verify_consumer.sh"

    - name: Enforce the issue write boundary against the actual diff
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ARU_PR_NUMBER: ${{ inputs.pr-number }}
        ARU_EXPECTED_HEAD: ${{ inputs.expected-head }}
      run: >-
        python3 "${ARU_SDLC_HOME}/hooks/enforce_touches.py" --pr "${ARU_PR_NUMBER}"
        --expected-head "${ARU_EXPECTED_HEAD}"
