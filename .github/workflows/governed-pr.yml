name: Aru governed pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: aru-governed-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governed-pr:
    name: aru-governed-pr
    if: ${{ github.event_name == 'merge_group' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run deterministic verification
        run: |
          python -m ruff check scripts hooks tests
          python -m pytest -q

      - name: Enforce the issue write boundary against the actual diff
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARU_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python hooks/enforce_touches.py --pr "$ARU_PR_NUMBER"
