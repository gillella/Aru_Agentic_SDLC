name: Aru governed pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: aru-governed-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governed-pr:
    name: aru-governed-pr
    if: ${{ github.event_name == 'merge_group' || !github.event.pull_request.draft }}
    runs-on: [self-hosted, macOS, ARM64, aru-ci]
    timeout-minutes: 15
    steps:
      - name: Validate self-hosted runner trust boundary
        env:
          ARU_EVENT_NAME: ${{ github.event_name }}
          ARU_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          ARU_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$ARU_EVENT_NAME" != "pull_request" || -z "$ARU_HEAD_REPOSITORY" || "$ARU_HEAD_REPOSITORY" != "$ARU_REPOSITORY" ]]; then
            echo "::error::Only verified pull_request events from this repository may execute on persistent self-hosted runners."
            exit 1
          fi
          command -v python3
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
          python3 -m pip --version
          command -v gh

      - name: Check out the exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare isolated verification environment
        run: |
          python3 -m venv "$RUNNER_TEMP/aru-ci-venv"
          "$RUNNER_TEMP/aru-ci-venv/bin/python" -m pip install -r requirements-dev.txt

      - name: Run deterministic verification
        run: |
          "$RUNNER_TEMP/aru-ci-venv/bin/python" -m ruff check scripts hooks tests
          "$RUNNER_TEMP/aru-ci-venv/bin/python" -m pytest -q

      - name: Enforce the issue write boundary against the actual diff
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARU_PR_NUMBER: ${{ github.event.pull_request.number }}
          ARU_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          "$RUNNER_TEMP/aru-ci-venv/bin/python" hooks/enforce_touches.py --pr "$ARU_PR_NUMBER"
          --expected-head "$ARU_EXPECTED_HEAD"
