name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # gitleaks-action scans the event commit range on push/pull_request.
  # Full-history `gitleaks detect` runs only on schedule / workflow_dispatch.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# gitleaks-action lists PR commits via the API; without pull-requests:read
# it fails with "Resource not accessible by integration" before scanning.
# issues:read is deliberately NOT granted here: only docs-freshness needs it,
# and a workflow-level grant would widen every job's token for no reason.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Three gates this playbook already ships to new projects via
  # scripts/init_project.py. Running them here closes the dogfooding gap
  # described in docs/ARU-SOFTWARE-FACTORY.md §2.2 / issue #86. Each job
  # fails the build on its own — none of these steps soft-fail.

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required so a PR-range scan can resolve base^..head.
          # push/pull_request: the action scans that event's commits, not the
          # whole repo. schedule/workflow_dispatch: full-history detect.
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependency audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          audited=0
          for req in requirements-dev.txt requirements.txt; do
            if [ -f "$req" ]; then
              pip-audit -r "$req"
              audited=1
            fi
          done
          if [ -f pyproject.toml ]; then
            if grep -q '^\[project\]' pyproject.toml; then
              pip-audit -r pyproject.toml
            else
              echo "pyproject.toml has no [project] table; skipping project-file audit."
            fi
            audited=1
          fi
          if [ "$audited" -eq 0 ]; then
            echo "No dependency manifest yet; nothing to audit."
          fi

  import-boundaries:
    name: Import Boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Enforce architectural layer contracts via import-linter
      - name: Enforce module boundaries
        run: |
          pip install -r requirements-dev.txt
          lint-imports

  # Documentation drift here accumulated in days (issue #115). A convention
  # that docs stay accurate is followed probabilistically; this job is the
  # mechanism. It runs on every push and pull request - so any documentation
  # change is covered - and on the weekly schedule above, which is what
  # catches a document that went stale because the *code* moved under it.
  docs-freshness:
    name: Documentation Freshness
    runs-on: ubuntu-latest
    # The checker reads documentation that a pull request controls. Bound the
    # job so a stalled lookup cannot hold a runner, and keep the checkout
    # credential out of .git/config so no excerpt can quote it into the log.
    timeout-minutes: 10
    # issues:read is scoped to this job alone, because only the issue-state
    # lookup needs it. The trusted step below is the only place it is usable.
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # scripts/check_docs.py is taken from the pull request, so on this event
      # it is attacker-controlled code. Handing it GH_TOKEN would give a PR the
      # workflow's read authority over contents, issues, and pull requests --
      # persist-credentials: false does not close that, because it only removes
      # the credential from .git/config, not from the process environment.
      # This path therefore runs with no credential at all. The cost is the
      # issue-state check, which --offline skips; the drift checks that do not
      # need the network still run and still fail the build.
      - name: Check documentation against the code it describes (untrusted PR)
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/check_docs.py --offline

      # push / schedule / workflow_dispatch run code that is already merged or
      # operator-triggered, so the full check runs here with the token. No
      # --offline: an issue whose state cannot be resolved fails the job rather
      # than silently skipping the check it was added for. This is the path
      # that catches a document gone stale because the code moved under it.
      - name: Check documentation against the code it describes (trusted)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/check_docs.py

  test-and-lint:
    name: Lint, Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Match the secret-scan checkout so a shallow tip cannot hide
          # history-dependent checks if more are added to this job later.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Unpinned, this step would drift from what agents run locally. The
      # version comes from requirements-dev.txt and the rules from
      # pyproject.toml, so a local `ruff check .` and this job agree.
      - name: Lint
        run: |
          ruff check .

      # Enforce 400-line maximum file size on all source files. Pre-existing
      # legacy files over 400 lines are frozen at their baseline line count
      # so no legacy file can grow beyond its baseline, and all new files must
      # be <= 400 lines.
      - name: Enforce File Line Ceilings
        run: |
          python -c "import os, sys
          LINE_CEILING = 400
          EXEMPTIONS = {
              'hooks/enforce_touches.py': 1708,
              'scripts/agent_presence.py': 928,
              'scripts/check_docs.py': 553,
              'scripts/claim_issue.py': 1068,
              'scripts/cleanup_worktrees.py': 887,
              'scripts/common.py': 914,
              'scripts/delivery_increments.py': 585,
              'scripts/deploy_preview.py': 978,
              'scripts/doctor_local_agent_integrations.py': 951,
              'scripts/factory_metrics.py': 584,
              'scripts/fetch_next_issue.py': 683,
              'scripts/fetch_next_work.py': 987,
              'scripts/fixtures/fleet/harness.py': 485,
              'scripts/fleet_status.py': 1673,
              'scripts/incident_intake.py': 558,
              'scripts/init_project.py': 1613,
              'scripts/install_local_agent_integrations.sh': 768,
              'scripts/merge_pr.py': 2954,
              'scripts/prd_to_issues.py': 623,
              'scripts/promote.py': 715,
              'scripts/revert_merge.py': 497,
              'scripts/run_fleet.py': 825,
              'scripts/slack_control_room.py': 1400,
              'scripts/slack_notify.py': 904,
              'scripts/slack_projects.py': 784,
              'scripts/smoke_preview.py': 459,
              'scripts/spawn_ephemeral_worker.py': 788,
              'scripts/triage_backlog.py': 613,
              'scripts/verify_citations.py': 876,
              'sdlc_flow_visualizer/app.js': 441,
              'sdlc_flow_visualizer/styles.css': 615,
              'tests/test_acceptance_runner.py': 417,
              'tests/test_claim_issue.py': 689,
              'tests/test_claim_review.py': 604,
              'tests/test_cleanup_worktrees.py': 909,
              'tests/test_create_pr.py': 461,
              'tests/test_delivery_increments.py': 445,
              'tests/test_deploy_preview.py': 1016,
              'tests/test_doc_freshness.py': 645,
              'tests/test_doctor_local_agent_integrations.py': 600,
              'tests/test_enforce_touches.py': 2188,
              'tests/test_fetch_next_work.py': 1029,
              'tests/test_fleet_status.py': 1373,
              'tests/test_incident_intake.py': 413,
              'tests/test_init_project.py': 598,
              'tests/test_issue_selection.py': 568,
              'tests/test_merge_pr.py': 3059,
              'tests/test_promote.py': 599,
              'tests/test_research_skill.py': 728,
              'tests/test_run_fleet.py': 545,
              'tests/test_slack_control_room.py': 1257,
              'tests/test_slack_notify.py': 1258,
              'tests/test_spawn_ephemeral_worker.py': 596,
              'tests/test_triage_backlog.py': 658,
          }
          violations = []
          skip_dirs = {'.git', '.venv', '.worktrees', 'node_modules', '__pycache__', 'dist'}
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in skip_dirs]
              for f in files:
                  if f.endswith(('.py', '.js', '.sh', '.css', '.html')):
                      path = os.path.normpath(os.path.join(root, f))
                      allowed = EXEMPTIONS.get(path, LINE_CEILING)
                      with open(path, 'rb') as fh:
                          lines = sum(1 for _ in fh)
                      if lines > allowed:
                          violations.append((path, lines, allowed))
          if violations:
              print(f'error: {len(violations)} files exceed allowed line ceiling:', file=sys.stderr)
              for path, lines, allowed in sorted(violations):
                  print(f'  {path}: {lines} lines (allowed max: {allowed})', file=sys.stderr)
              sys.exit(1)
          print('File line ceiling check passed.')
          "

      # Covers hooks/ and tests/ as well as scripts/. hooks/enforce_touches.py
      # is the write-time enforcement gate and was previously reached only
      # because an unrelated test imports it - coverage by accident, not by a
      # gate. The module signals refusal with EXIT_BLOCK = 2 and an unhandled
      # crash exits 1, which is not that signal.
      - name: Verify Source & Tests Hygiene
        run: |
          python -c "import os, sys, unittest
          sources = ['scripts', 'hooks', 'sdlc_flow_visualizer', 'dummy_calculator_app']
          present = [d for d in sources if os.path.isdir(d) and any(f.endswith('.py') for _, _, files in os.walk(d) for f in files)]
          count = 0
          if os.path.isdir('tests'):
              suite = unittest.defaultTestLoader.discover('tests')
              count = suite.countTestCases()
          if present and count == 0:
              print(f'error: source directories ({ \" \".join(present) }) exist, but tests/ is absent or contains zero importable test cases.', file=sys.stderr)
              sys.exit(1)
          "

      - name: Verify Python Syntax
        run: |
          python -c "import glob, py_compile
          files = [f for pattern in ['scripts/*.py', 'hooks/*.py', 'tests/*.py'] for f in glob.glob(pattern)]
          for f in files:
              py_compile.compile(f, doraise=True)
          "

      - name: Execute Tests
        run: |
          python -m unittest discover tests
