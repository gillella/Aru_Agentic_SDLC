name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # gitleaks-action scans the event commit range on push/pull_request.
  # Full-history `gitleaks detect` runs only on schedule / workflow_dispatch.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# gitleaks-action lists PR commits via the API; without pull-requests:read
# it fails with "Resource not accessible by integration" before scanning.
# issues:read is deliberately NOT granted here: only docs-freshness needs it,
# and a workflow-level grant would widen every job's token for no reason.
permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-lint:
    name: Lint, Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Match the secret-scan checkout so a shallow tip cannot hide
          # history-dependent checks if more are added to this job later.
          fetch-depth: 0

      # gitleaks-action scans the event commit range on push/pull_request and
      # full history on schedule/workflow_dispatch. Keeping it in this required
      # job preserves the gate without paying a separate five-minute minimum.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Dependency audit
        run: |
          pip install pip-audit
          audited=0
          for req in requirements-dev.txt requirements.txt; do
            if [ -f "$req" ]; then
              pip-audit -r "$req"
              audited=1
            fi
          done
          if [ -f pyproject.toml ]; then
            if grep -q '^\[project\]' pyproject.toml; then
              pip-audit -r pyproject.toml
            else
              echo "pyproject.toml has no [project] table; skipping project-file audit."
            fi
            audited=1
          fi
          if [ "$audited" -eq 0 ]; then
            echo "No dependency manifest yet; nothing to audit."
          fi

      # Enforce architectural layer contracts via import-linter. The tool is
      # pinned in requirements-dev.txt and was installed by the shared setup.
      - name: Enforce module boundaries
        run: lint-imports

      # Pull requests control scripts/check_docs.py. Run it without a token so
      # untrusted code cannot inherit the workflow's read authority. The issue
      # lookup is deliberately skipped; all offline drift checks still fail
      # this required job when documentation disagrees with the code.
      - name: Check documentation against the code it describes (untrusted PR)
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_docs.py --offline

      # Unpinned, this step would drift from what agents run locally. The
      # version comes from requirements-dev.txt and the rules from
      # pyproject.toml, so a local `ruff check .` and this job agree.
      - name: Lint
        run: |
          ruff check .

      # Enforce the per-file line ceiling. New files must be <= 400 lines;
      # legacy files over that carry their own allowance as a `line-ceiling:`
      # marker comment in the file itself, so raising one file's allowance does
      # not require editing a file shared with unrelated work.
      - name: Enforce File Line Ceilings
        run: python3 scripts/check_line_ceilings.py

      # Covers hooks/ and tests/ as well as scripts/. hooks/enforce_touches.py
      # is the write-time enforcement gate and was previously reached only
      # because an unrelated test imports it - coverage by accident, not by a
      # gate. The module signals refusal with EXIT_BLOCK = 2 and an unhandled
      # crash exits 1, which is not that signal.
      - name: Verify Source & Tests Hygiene
        run: |
          python -c "import os, sys, unittest
          sources = ['scripts', 'hooks', 'sdlc_flow_visualizer', 'dummy_calculator_app']
          present = [d for d in sources if os.path.isdir(d) and any(f.endswith('.py') for _, _, files in os.walk(d) for f in files)]
          count = 0
          if os.path.isdir('tests'):
              suite = unittest.defaultTestLoader.discover('tests')
              count = suite.countTestCases()
          if present and count == 0:
              print(f'error: source directories ({ \" \".join(present) }) exist, but tests/ is absent or contains zero importable test cases.', file=sys.stderr)
              sys.exit(1)
          "

      - name: Verify Python Syntax
        run: |
          python -c "import glob, py_compile
          files = [f for pattern in ['scripts/*.py', 'hooks/*.py', 'tests/*.py'] for f in glob.glob(pattern)]
          for f in files:
              py_compile.compile(f, doraise=True)
          "

      # This guidelines/meta project records focused story tests in current-head
      # PR evidence. The complete suite is a separate phase/pre-release
      # checkpoint, triggered weekly or manually and bound to the exact tested
      # default-branch commit in the governing epic. Pull requests and pushes
      # still get every fast static gate above.
      - name: Execute Tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python -m unittest discover tests

  # The network-backed documentation check needs issues:read. It stays in a
  # separate job that is skipped before runner allocation for pull requests,
  # so PR-controlled code never receives a token and does not incur a second
  # billable job. Push, schedule, and manual events run only trusted code here.
  trusted-docs-freshness:
    name: Documentation Freshness
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check documentation against the code it describes (trusted)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_docs.py
