name: Deploy Preview

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Merged commit SHA to deploy preview for'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "preview-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build static preview site
        run: |
          TARGET_REF="${{ inputs.commit_sha || github.sha }}"
          echo "Building preview for commit: ${TARGET_REF}"
          mkdir -p dist
          if [ -f "index.html" ]; then
            cp -r index.html dist/
          fi
          if [ -d "docs" ]; then
            cp -r docs dist/
          fi
          if [ -d "static" ]; then
            cp -r static dist/
          fi
          if [ ! -f "dist/index.html" ]; then
            cat <<EOF > dist/index.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Preview - ${TARGET_REF}</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; }
    h1 { color: #0969da; }
    .badge { background: #dafbe1; color: #1a7f37; padding: 0.25rem 0.5rem; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Preview Environment</h1>
  <p><span class="badge">Active</span> Deployed Commit: <code>${TARGET_REF}</code></p>
  <h2>Project Artifacts</h2>
  <ul>
    <li><a href="docs/">Documentation</a></li>
  </ul>
</body>
</html>
EOF
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish preview URL
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "Preview URL: ${PAGE_URL}" >> $GITHUB_STEP_SUMMARY
          echo "Preview URL: ${PAGE_URL}"
