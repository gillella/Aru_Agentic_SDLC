name: Deploy Preview
run-name: "Deploy Preview for ${{ inputs.commit_sha || github.sha }} (${{ inputs.run_token || 'default' }})"

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Merged commit SHA to deploy preview for'
        required: true
        type: string
      run_token:
        description: 'Correlation token for dispatch matching'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "preview-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build static preview site
        env:
          TARGET_REF: ${{ inputs.commit_sha || github.sha }}
        run: |
          echo "Building preview for commit: ${TARGET_REF}"
          if [ -f "scripts/build_preview.py" ]; then
            python3 scripts/build_preview.py --source . --output dist
          else
            mkdir -p dist
            if [ -f "index.html" ]; then
              cp -r index.html dist/
              for d in docs static assets css js styles images img media; do
                if [ -d "$d" ]; then cp -r "$d" dist/; fi
              done
            elif [ -d "sdlc_flow_visualizer" ] && [ -f "sdlc_flow_visualizer/index.html" ]; then
              cp -r sdlc_flow_visualizer/* dist/
            elif [ -d "public" ] && [ -f "public/index.html" ]; then
              cp -r public/* dist/
            elif [ -d "dist" ] && [ -f "dist/index.html" ]; then
              echo "dist/index.html already present"
            else
              echo "[ERROR] No deployable static entrypoint (index.html) found." >&2
              exit 1
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish preview URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Preview URL: ${PAGE_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview URL: ${PAGE_URL}"
