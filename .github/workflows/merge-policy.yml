name: Aru merge policy
# aru-runner-profile: self-hosted-mac

# `pull_request_target` runs the copy of this file that is on the base branch, so a
# pull request cannot change what this check does to its own head. That is the whole
# point of this workflow: `aru-governed-pr` runs from the pull-request head, so a pull
# request that rewrites it keeps the check name and goes green without running anything.
#
# The safety rule that makes `pull_request_target` acceptable: nothing here checks out,
# installs, or executes pull-request code. The base branch is checked out, and the write
# boundary is recomputed from the GitHub API by the trusted copy of the enforcement
# script. Do not add a step that reads the head ref, runs the branch's tests, or installs
# its dependencies.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: aru-merge-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-policy:
    name: aru-merge-policy
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, macOS, ARM64, aru-ci]
    timeout-minutes: 10
    steps:
      - name: Validate self-hosted runner trust boundary
        env:
          ARU_EVENT_NAME: ${{ github.event_name }}
          ARU_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          ARU_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$ARU_EVENT_NAME" != "pull_request_target" || -z "$ARU_HEAD_REPOSITORY" || "$ARU_HEAD_REPOSITORY" != "$ARU_REPOSITORY" ]]; then
            echo "::error::Only verified pull_request events from this repository may execute on persistent self-hosted runners."
            exit 1
          fi
          command -v python3
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'

      - name: Check out the base branch, never the pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Enforce the issue write boundary with the base branch's own checker
        env:
          GH_TOKEN: ${{ github.token }}
          ARU_PR_NUMBER: ${{ github.event.pull_request.number }}
          ARU_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 hooks/enforce_touches.py --pr "$ARU_PR_NUMBER"
          --expected-head "$ARU_EXPECTED_HEAD"

