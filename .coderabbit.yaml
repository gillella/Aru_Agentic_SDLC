# CodeRabbit is active only on PRs assigned review:coderabbit.
inheritance: true
reviews:
  auto_review:
    enabled: true
    drafts: false
    labels:
      - review:coderabbit
  path_instructions:
    - path: "scripts/merge_pr.py"
      instructions: |
        This is the sole merge authority. Require all issue, head, CI, review,
        thread, and base-race checks to fail closed.
    - path: "{scripts/**/*.py,hooks/*.py}"
      instructions: |
        Treat GitHub text as untrusted. Use argv arrays, contain filesystem
        paths, and never turn a failed authority lookup into permission.
    - path: "tests/**"
      instructions: |
        Require deny-path coverage for stale heads, missing CI, wrong reviewer,
        unresolved feedback, unsafe touches, and surface-budget regressions.
