name: Aru merge policy
# aru-runner-profile: __ARU_RUNNER_PROFILE__

# A stub, on purpose. `pull_request_target` runs the copy of this file that is on
# the base branch, so a pull request cannot change what this check does to its
# own head, and the action reference below is the base branch's too. The checks
# run from __ARU_FACTORY_REPOSITORY__ at the pinned tag; `init_project.py --sync`
# changes only that tag.
#
# This workflow deliberately triggers on `pull_request_target` alone. A
# `pull_request_review` trigger would re-evaluate after an approval, but GitHub
# runs the pull request's own copy of the workflow for that event, which would
# hand a change control of the check that judges it. The review posture is
# therefore enforced by `merge_pr.py`, the only path that submits a merge.
#
# The safety rule that makes `pull_request_target` acceptable: nothing here
# checks out, installs or executes pull-request code. The base branch is checked
# out, and every head byte the Factory's action reads comes through the contents
# API and is hashed, never run. Do not add a step that reads the head ref, runs
# the branch's tests, or installs its dependencies.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: aru-merge-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-policy:
    name: aru-merge-policy
    if: ${{ !github.event.pull_request.draft }}
    runs-on: __ARU_RUNS_ON__
    timeout-minutes: 10
    steps:
      - name: __ARU_TRUST_STEP__
        env:
          ARU_EVENT_NAME: ${{ github.event_name }}
          ARU_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          ARU_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$ARU_EVENT_NAME" != "pull_request_target" || -z "$ARU_HEAD_REPOSITORY" || "$ARU_HEAD_REPOSITORY" != "$ARU_REPOSITORY" ]]; then
            echo "::error::__ARU_TRUST_MESSAGE__"
            exit 1
          fi

      - name: Check out the base branch, never the pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Run the Factory's merge-policy checks
        uses: __ARU_FACTORY_REPOSITORY__/.github/actions/merge-policy@v__ARU_FACTORY_VERSION__
        with:
          pr-number: ${{ github.event.pull_request.number }}
          expected-head: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ github.token }}
