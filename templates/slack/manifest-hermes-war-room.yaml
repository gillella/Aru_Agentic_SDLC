display_information:
  name: Hermes War Room
  description: Hermes Agent escalation listener for the Aru coding war room. Wakes on @mention; escalates material items to Telegram.
  background_color: "#1d1d2e"
features:
  bot_user:
    display_name: hermes-war-room
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:read
      - channels:history
      - groups:read
      - groups:history
      - users:read
      - im:history
      - reactions:read
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
