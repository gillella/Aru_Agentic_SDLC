display_information:
  name: Aru Factory
  description: Control room for the Aru Agentic SDLC factory. GitHub remains the work queue.
  background_color: "#1d76db"
features:
  bot_user:
    display_name: Aru Factory
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
