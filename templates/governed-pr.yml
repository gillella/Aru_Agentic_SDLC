name: Aru governed pull request
# aru-runner-profile: __ARU_RUNNER_PROFILE__

# A stub, on purpose. The checks run from __ARU_FACTORY_REPOSITORY__ at the tag
# pinned below, so verification logic is never copied into a consumer and a pull
# request cannot rewrite the script that judges it. `init_project.py --sync`
# changes only the pinned tag. Do not add verification steps here: the Factory's
# own verifier refuses a stub that calls anything else.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: aru-governed-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governed-pr:
    name: aru-governed-pr
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: __ARU_RUNS_ON__
    timeout-minutes: 20
    steps:
      - name: __ARU_TRUST_STEP__
        env:
          ARU_EVENT_NAME: ${{ github.event_name }}
          ARU_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          ARU_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$ARU_EVENT_NAME" != "pull_request" || -z "$ARU_HEAD_REPOSITORY" || "$ARU_HEAD_REPOSITORY" != "$ARU_REPOSITORY" ]]; then
            echo "::error::__ARU_TRUST_MESSAGE__"
            exit 1
          fi

      - name: Check out the exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run the Factory's governed checks
        uses: __ARU_FACTORY_REPOSITORY__/.github/actions/governed-pr@v__ARU_FACTORY_VERSION__
        with:
          runner-profile: __ARU_RUNNER_PROFILE__
          pr-number: ${{ github.event.pull_request.number }}
          expected-head: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ github.token }}
