# Single source for the kernel's declared gates.
#
# docs/ENFORCEMENT-REGISTER.md is RENDERED from this file. Do not hand-edit the
# register: edit here, then regenerate. tests/test_policy.py fails when the two
# disagree and names the regeneration command.

# The one declared release. README's project-status line, the newest released
# heading in CHANGELOG.md and the newest `v*` tag restate it, and
# tests/test_release_truth.py fails when any of them disagrees. Change it only
# through the release procedure in docs/OPERATIONS.md, never to describe work
# that has not been tagged.
[release]
version = "2.3.0"
released = "2026-09-14"

[register]
title = "Enforcement Register"
columns = ["Control", "Blocks or authorizes", "Mechanism"]
notes = [
"""
Anything not listed here is guidance, not an authorization mechanism.
External Driver timing and consumer risk policy are therefore coordination and
product policy, respectively; neither is a second Kernel gate. Their boundary
is defined once in `docs/KERNEL-CONTRACT.md`.""",
"""
For this repository, the live default-branch ruleset requires the
`aru-governed-pr` and `aru-merge-policy` contexts produced by the
authenticated GitHub Actions App, and one approving review with stale
approvals dismissed. GitHub enforces the approval rule; `merge_pr.py` rereads
the same evidence before submission.
The merge-authority App gate is enabled here: `aru-merge-authorized` is
required, pinned by `integration_id` to the merge-authority App, so only a
holder of that App's key can satisfy it and `merge_pr.py` is the only path that
completes a merge. A consumer scaffolded without `--merge-app-id` has no App to
pin and therefore does not get this check; there, any account with write access
can merge once the other contexts pass.
Approval of the most recent push by an account other than its pusher is not
required. The App pushes on the factory's behalf and a person approves, so that
rule demanded a second approver on every pull request and nothing could merge;
it is declared false rather than silently removed. Stale-approval dismissal
stays on, so a new push still voids every approval.
A repository administrator can still edit the ruleset; that residual boundary
remains consumer-owned.""",
"""
Managed-file integrity detects drift in the head and, from the base branch, refuses a
head whose Factory-managed files diverge from the merged manifest. An upgrade head that
changes `.aru/factory-version` is judged against its own manifest, whose authenticity
only the Factory's `merge_pr.py` can establish (issue I3); an administrator can still
rewrite `.aru/verify.sh` together with the manifest, or edit the workflow or ruleset.""",
]

[[gate]]
id = "issue-contract"
enforcers = ["triage_backlog.py"]
control = "issue contract"
blocks = "Backlog -> Ready"
mechanism = "`triage_backlog.py`"

[[gate]]
id = "five-statuses"
enforcers = ["triage_backlog.py", "claim_issue.py", "create_pr.py", "merge_pr.py"]
control = "five statuses"
blocks = "invariant-bearing lifecycle transitions"
mechanism = "`triage_backlog.py`, `claim_issue.py`, `create_pr.py`, `merge_pr.py`"

[[gate]]
id = "exclusive-claim"
enforcers = ["claim_issue.py"]
control = "exclusive claim"
blocks = "Ready -> In Progress"
mechanism = "`claim_issue.py`"

[[gate]]
id = "path-budget"
enforcers = ["enforce_touches.py", "aru-governed-pr"]
control = "path budget"
blocks = "writes outside `touches:`"
mechanism = "`hooks/enforce_touches.py`, `aru-governed-pr` actual-diff check"

[[gate]]
id = "path-budget-unrewritable"
enforcers = ["aru-merge-policy"]
control = "path budget, unrewritable"
blocks = "writes outside `touches:` when the pull request edits its own workflow"
mechanism = "`aru-merge-policy` runs the base branch copy of itself on `pull_request_target`, never reads the head, and posts its verdict as a required status on the head"

[[gate]]
id = "managed-file-integrity"
enforcers = ["aru-governed-pr", "aru-merge-policy"]
control = "managed file integrity"
blocks = "merging a head whose Factory-managed files differ from `.aru/manifest.json`"
mechanism = "`.aru/verify.sh` first section on the exact head; `aru-merge-policy` base-branch step `.aru/hooks/check_manifest.py` comparing head file hashes read through the API to the base branch's manifest"

[[gate]]
id = "default-branch-protection"
enforcers = ["pre-push"]
control = "default-branch protection"
blocks = "direct push to the resolved remote default branch"
mechanism = "`hooks/pre-push`"

[[gate]]
id = "worktree-isolation"
enforcers = ["create_branch.py"]
control = "worktree isolation"
blocks = "first implementation edit"
mechanism = "`create_branch.py`"

[[gate]]
id = "closure-link"
enforcers = ["create_pr.py"]
control = "closure link"
blocks = "PR creation"
mechanism = "`create_pr.py`"

[[gate]]
id = "exact-head-consumer-verification"
enforcers = ["check_ci.py", "merge_pr.py", "aru-governed-pr", ".aru/verify.sh"]
control = "exact-head consumer verification"
blocks = "merge"
mechanism = "`aru-governed-pr`, `.aru/verify.sh`, `check_ci.py`, `merge_pr.py`"

[[gate]]
id = "one-account-assigned-runner-profile"
enforcers = ["init_project.py", ".aru/verify.sh"]
control = "one account-assigned runner profile"
blocks = "required verification dispatch"
mechanism = "`init_project.py` account policy, workflow `# aru-runner-profile:` marker, `.aru/verify.sh` marker/`runs-on:` agreement"

[[gate]]
id = "no-cross-profile-runner-fallback"
enforcers = [".aru/verify.sh"]
control = "no cross-profile runner fallback"
blocks = "required verification dispatch"
mechanism = "`.aru/verify.sh` per-profile forbidden patterns: `self-hosted-mac` rejects hosted images, `github-hosted` rejects `self-hosted`"

[[gate]]
id = "current-board-and-dependencies"
enforcers = ["merge_state.py"]
control = "current board and dependencies"
blocks = "merge submission and direct-merge finalization"
mechanism = "`merge_state.py` fresh Project/card/status-field identity, label agreement and closed dependencies"

[[gate]]
id = "configured-product-verification"
enforcers = [".aru/verify.sh"]
control = "configured product verification"
blocks = "consumer check success"
mechanism = "`.aru/verify.sh` requires executable `.aru/verify-project.sh`; generated starter fails"

[[gate]]
id = "unresolved-findings"
enforcers = ["fetch_pr_feedback.py", "merge_pr.py"]
control = "unresolved findings"
blocks = "author feedback routing, merge, final revalidation and close-out"
mechanism = "`fetch_pr_feedback.py` reads submitted P0/P1-labelled summaries and unresolved threads, including outdated ones; `fetch_next_work.py` routes feedback to the author; `merge_pr.py` refuses until resolved. Summary clearance needs explicit original-reviewer evidence on the current head; approval alone is insufficient."

[[gate]]
id = "approval-by-an-authorized-reviewer"
enforcers = ["merge_pr.py", "review_authority.py", "aru-merge-policy"]
control = "approval by an authorized reviewer"
blocks = "merge, under the `human` posture"
mechanism = "`.aru/review.json` on the default branch names the accounts that may approve; `review_authority.py` refuses an unlisted account and refuses any GitHub App outright, and requires the approval to carry a written body. Applied by `merge_pr.py`, the only path that submits a merge; `aru-merge-policy` does not apply it, because the trigger that would re-evaluate after an approval runs the pull request's own copy of the workflow"

[[gate]]
id = "posture-resolution"
enforcers = ["review_authority.py"]
control = "posture resolution"
blocks = "merge, when the declaration is unusable"
mechanism = "absent, malformed or unknown resolves to `human`, so a repository cannot lose the gate by omission; a repository that declared nothing authorizes its owner rather than nobody"

[[gate]]
id = "approval-by-another-account"
enforcers = ["merge_pr.py", "ruleset"]
control = "approval by another account"
blocks = "merge"
mechanism = "ruleset: one approval, stale approvals dismissed, last-push approval; `merge_pr.py` `approved_at_head` rereads the reviews before submission"

[[gate]]
id = "base-head-race"
enforcers = ["merge_pr.py"]
control = "base/head race"
blocks = "merge"
mechanism = "`merge_pr.py --expected-head`"

[[gate]]
id = "helper-only-merge-optional"
enforcers = ["merge_pr.py", "ruleset"]
control = "helper-only merge (optional)"
blocks = "merge submission by any other path"
mechanism = "`merge_pr.py` posts `aru-merge-authorized` as the configured merge-authority App; the ruleset requires it pinned by `integration_id`"

[[gate]]
id = "issue-done-and-cleanup"
enforcers = ["merge_pr.py", "cleanup_worktrees.py"]
control = "issue Done and cleanup"
blocks = "close-out"
mechanism = "`merge_pr.py`, `cleanup_worktrees.py`"

[[gate]]
id = "reverse-gear"
enforcers = ["revert_merge.py"]
control = "reverse gear"
blocks = "unsafe merged change"
mechanism = "`revert_merge.py`"

[[gate]]
id = "anti-regrowth-budgets"
enforcers = ["test_surface.py"]
control = "anti-regrowth budgets"
blocks = "CI"
mechanism = "`tests/test_surface.py`"

[ruleset]
# The server-enforced merge boundary written by init_project.py.
name = "aru-protect-main"
allowed_merge_methods = ["merge"]
required_approving_review_count = 1
dismiss_stale_reviews_on_push = true
required_review_thread_resolution = true
require_code_owner_review = false
# An App pushes on the factory's behalf and a person approves, so GitHub sees a
# push whose author is never the approver. This rule therefore demanded a second
# approver on every pull request the factory produced and nothing could merge.
# Switched off deliberately on 2026-09-12; dismiss_stale_reviews_on_push stays
# true and already voids every approval on a new push, which is the protection
# that actually mattered. Declared here rather than edited into the live ruleset
# so the decision is reviewable instead of invisible.
require_last_push_approval = false
# Requires a second approval when a push carries changes the pusher did not
# write. Live on this repository and previously undeclared, which is the drift
# this table exists to prevent.
require_extra_approval_for_unattributed_changes = true
# Empty on purpose: no actor may bypass the boundary.
bypass_actors = []
# Empty on purpose: authority to approve is resolved from .aru/review.json by
# review_authority.py, not pinned into the ruleset.
required_reviewers = []
# Pinned by integration_id to the merge-authority App, so only merge_pr.py can
# satisfy it. Absent from required_checks because a consumer scaffolded without
# --merge-app-id has no App to pin; init_project.py appends it when one exists.
merge_authority_check = "aru-merge-authorized"
# aru-governed-pr runs the pull request's own copy of its workflow; aru-merge-policy
# runs the base branch's copy and posts its verdict on the head. Requiring both means
# a pull request cannot rewrite the only check standing in its way.
required_checks = ["aru-governed-pr", "aru-merge-policy"]

[kernel_path]
# Rendered into the AGENTS.md non-negotiable list between its generated markers.
steps = [
"""
1. Use the GitHub issue and linked Project Board as lifecycle authority.""",
"""
2. Require the Ready contract: unchecked acceptance criteria, one safe
   `touches:` declaration, and no unresolved dependency. Scope is not frozen at
   promotion: the merge gate reads the declaration that is live at merge time,
   so a claimant who needs an omitted path corrects the declaration and the
   gate judges the corrected one.""",
"""
3. Claim before editing and work only in the issue's isolated worktree.""",
"""
4. Keep the change inside `touches:` and run useful local preflight as needed.""",
"""
5. Open the PR through `create_pr.py` with `Closes #N`. Require the exact-head
   `aru-governed-pr` check: GitHub Actions orchestrates it on the one runner
   profile the repository's account is assigned, where it runs the consumer's
   `.aru/verify.sh` and validates `touches:` against the actual diff. Never
   fall back to another profile's runners.""",
"""
6. Resolve every finding and thread, and obtain one approval of the exact head
   from a GitHub account other than the PR author. Every PR needs it,
   documentation included; a push dismisses earlier approvals.""",
"""
7. Submit only through `merge_pr.py --expected-head`. Configured merge queues
   and pending queue/auto-merge requests are unsupported and refused. Verify
   GitHub actually merged before Done and cleanup.""",
]

[runner_profiles]
# Account assignments for the runner profile a repository verifies on.
# An account absent here has NO default: it must declare its profile explicitly
# with --runner-profile. There is still no fallback and no cross-profile reroute.
[runner_profiles.accounts]
gillella = "self-hosted-mac"
"unum-inc" = "github-hosted"
